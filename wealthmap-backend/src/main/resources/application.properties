server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-1-ap-south-1.pooler.supabase.com:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.jgfmhqhoozvjjwnphctm}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Alokisvinay@2006}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Tuning for Supabase Session Pooler (max 15 clients limit)
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=30000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Server Error & Stack Trace Protection
server.error.include-stacktrace=never
server.error.include-exception=false

# JWT (Base64 encoded 256-bit key)
jwt.secret=${JWT_SECRET:ZGVmYXVsdFNlY3JldEtleVRoYXRJc0F0TGVhc3QyNTZCaXRzTG9uZzEyMzQ1Njc4OTA=}
jwt.expiration=86400000

# External APIs
gold.api.key=${GOLD_API_KEY:your-goldapi-key}
twelvedata.api.key=${TWELVEDATA_API_KEY:your-twelvedata-key}

# Brevo HTTP Email API
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=alokgdsc@gmail.com

# Automation / Scheduling
automation.price-alert.scan-ms=300000
automation.maturity.reminder-days=7
automation.maturity.scan-cron=0 0 8 * * *
automation.digest.weekly-cron=0 0 9 * * MON
automation.digest.monthly-cron=0 0 9 1 * *

# Google Gemini AI (Free Tier)
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-1.5-flash}

# Google OAuth & Drive API (drive.file scope)
google.client.id=${GOOGLE_CLIENT_ID:}
google.client.secret=${GOOGLE_CLIENT_SECRET:}
google.redirect.uri=${GOOGLE_REDIRECT_URI:http://localhost:5173/auth/google/callback}

# Allowed CORS Origins (comma-separated, override via CORS_ALLOWED_ORIGINS in deployment)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,https://*.vercel.app,https://*.netlify.app,https://*.onrender.com}

# Multipart upload limits
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

